name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: v0.1.0

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APKs and Server Binaries, Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/tools/bin:${PATH}"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e

      - name: Build Linux server binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/openflux-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/openflux-linux-arm64 .

      - name: Build Android APKs
        run: |
          BUILD_TYPE=debug GRADLE_BIN="$(command -v gradle)" ./build_android_app.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum OpenFlux-android-*.apk openflux-linux-* > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/OpenFlux-android-*.apk \
            dist/openflux-linux-* \
            dist/SHA256SUMS \
            --title "OpenFlux $RELEASE_TAG" \
            --notes "OpenFlux Android VPN client and Linux exit-node binaries ($RELEASE_TAG). Compatible with upstream OpenFlux with auto-detection for Yandex Docs (both Volga and classic editors)." || \
          gh release upload "$RELEASE_TAG" \
            dist/OpenFlux-android-*.apk \
            dist/openflux-linux-* \
            dist/SHA256SUMS \
            --clobber
